<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Zuriq-HMIS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        canvas: '#F6F5F1', ink: '#16231F', muted: '#5B6B66',
                        brand: { 50: '#EAF3F1', 500: '#1D8874', 600: '#0F6B5C', 700: '#0B5347' },
                        danger: '#B23B3B'
                    },
                    fontFamily: { sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body class="bg-canvas min-h-screen font-sans text-ink flex items-center justify-center px-4">

    <div class="w-full max-w-sm">
        <div class="flex items-center gap-3 justify-center mb-8">
            <div class="w-10 h-10 rounded-lg bg-brand-600 text-white flex items-center justify-center font-semibold">ZH
            </div>
            <span class="text-xl font-semibold tracking-tight">Zuriq-HMIS</span>
        </div>

        <div class="bg-white rounded-xl border border-ink/10 p-6 shadow-sm">
            <h1 class="text-lg font-semibold mb-4">Log in</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="mb-4 rounded-lg px-4 py-3 text-sm border
                    {% if category == 'info' %} bg-brand-50 text-brand-700 border-brand-100
                    {% else %} bg-danger/10 text-danger border-danger/20 {% endif %}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="post" class="space-y-4">
                <div>
                    <label class="block text-sm text-muted mb-1">Username</label>
                    <input name="username" required autofocus
                        class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-sm text-muted mb-1">Password</label>
                    <input type="password" name="password" required
                        class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <button type="submit"
                    class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium px-4 py-2 rounded-lg shadow-sm transition">
                    Log in
                </button>
            </form>
        </div>
    </div>

</body>

</html>
