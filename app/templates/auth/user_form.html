{% extends "base.html" %}
{% block title %}Add User — Zuriq-HMIS{% endblock %}
{% block breadcrumb %}Users{% endblock %}
{% block content %}

<h1 class="text-2xl font-semibold text-ink mb-6">Add Staff Account</h1>

<form method="post" class="bg-white rounded-xl border border-ink/10 p-6 max-w-md space-y-4">
    <div>
        <label class="block text-sm text-muted mb-1">Username *</label>
        <input name="username" required class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
        <label class="block text-sm text-muted mb-1">Password *</label>
        <input type="password" name="password" required minlength="8"
               class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm">
        <p class="text-xs text-muted/60 mt-1">At least 8 characters. Share it with them directly — there's no email/reset flow yet.</p>
    </div>
    <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white font-medium px-5 py-2 rounded-lg shadow-sm transition">
            Create Account
        </button>
        <a href="{{ url_for('auth.list_users') }}" class="text-muted hover:text-ink text-sm">Cancel</a>
    </div>
</form>

{% endblock %}
