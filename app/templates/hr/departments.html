{% extends "base.html" %}
{% block title %}Departments — Zuriq-HMIS{% endblock %}
{% block breadcrumb %}HR{% endblock %}
{% block content %}

<h1 class="text-2xl font-semibold text-ink mb-6">Departments</h1>

<form method="post" class="bg-white rounded-xl border border-ink/10 p-4 mb-6 flex items-end gap-3 max-w-md">
    <div class="flex-1">
        <label class="block text-sm text-muted mb-1">New Department</label>
        <input name="name" required class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm" placeholder="e.g. Outpatient">
    </div>
    <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2 rounded-lg">Add</button>
</form>

<div class="bg-white rounded-xl border border-ink/10 overflow-hidden max-w-md">
    <table class="w-full text-sm text-left">
        <tbody class="divide-y divide-ink/5">
            {% for d in departments %}
            <tr class="hover:bg-canvas/60"><td class="px-4 py-3 font-medium">{{ d.name }}</td></tr>
            {% else %}
            <tr><td class="px-4 py-8 text-center text-muted/60">No departments yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
