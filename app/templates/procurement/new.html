{% extends "base.html" %}
{% block title %}New Purchase Order — Zuriq-HMIS{% endblock %}
{% block breadcrumb %}Procurement{% endblock %}
{% block content %}

<h1 class="text-2xl font-semibold text-ink mb-6">New Purchase Order</h1>

{% if not suppliers %}
<div class="bg-warn/10 border border-warn/20 text-warn rounded-lg px-4 py-3 text-sm mb-6">
    No suppliers yet — <a href="{{ url_for('pharmacy.new_supplier') }}" class="underline font-medium">add one</a> first.
</div>
{% endif %}

<form method="post" class="bg-white rounded-xl border border-ink/10 p-6 max-w-3xl space-y-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm text-muted mb-1">Supplier *</label>
            <select name="supplier_id" required class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm">
                <option value="">— Select —</option>
                {% for s in suppliers %}
                <option value="{{ s.supplier_id }}">{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm text-muted mb-1">Order Reference</label>
            <input name="order_reference" class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm text-muted mb-1">Valid Until</label>
            <input type="date" name="validity_date" class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm">
        </div>
    </div>

    <div>
        <label class="block text-sm text-muted mb-1">Terms & Conditions</label>
        <textarea name="terms_conditions" rows="2" class="w-full border border-ink/15 rounded-lg px-3 py-2 text-sm"></textarea>
    </div>

    <div id="line-items" class="space-y-3">
        <div class="grid grid-cols-12 gap-3 text-xs font-semibold text-muted uppercase px-1">
            <div class="col-span-5">Product</div>
            <div class="col-span-2">Quantity</div>
            <div class="col-span-3">Rate (KES)</div>
            <div class="col-span-2"></div>
        </div>
        <div class="line-item grid grid-cols-12 gap-3">
            <select name="product_id" class="col-span-5 border border-ink/15 rounded-lg px-3 py-2 text-sm">
                <option value="">— Select product —</option>
                {% for p in products %}
                <option value="{{ p.product_id }}" data-cost="{{ p.unit_cost }}">{{ p.name }}</option>
                {% endfor %}
            </select>
            <input type="number" name="quantity" value="1" min="1" class="col-span-2 border border-ink/15 rounded-lg px-3 py-2 text-sm">
            <input type="number" step="0.01" min="0" name="rate" class="col-span-3 border border-ink/15 rounded-lg px-3 py-2 text-sm">
            <button type="button" onclick="removeLine(this)" class="col-span-2 text-sm text-danger hover:text-danger/80">Remove</button>
        </div>
    </div>

    <button type="button" onclick="addLine()" class="text-sm text-brand-600 hover:text-brand-700 font-medium">
        + Add another product
    </button>

    <div class="flex items-center gap-3 pt-4 border-t border-ink/10">
        <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white font-medium px-5 py-2 rounded-lg shadow-sm transition">
            Create Purchase Order
        </button>
        <a href="{{ url_for('procurement.list_purchase_orders') }}" class="text-muted hover:text-ink text-sm">Cancel</a>
    </div>
</form>

<template id="line-template">
    <div class="line-item grid grid-cols-12 gap-3">
        <select name="product_id" class="col-span-5 border border-ink/15 rounded-lg px-3 py-2 text-sm">
            <option value="">— Select product —</option>
            {% for p in products %}
            <option value="{{ p.product_id }}" data-cost="{{ p.unit_cost }}">{{ p.name }}</option>
            {% endfor %}
        </select>
        <input type="number" name="quantity" value="1" min="1" class="col-span-2 border border-ink/15 rounded-lg px-3 py-2 text-sm">
        <input type="number" step="0.01" min="0" name="rate" class="col-span-3 border border-ink/15 rounded-lg px-3 py-2 text-sm">
        <button type="button" onclick="removeLine(this)" class="col-span-2 text-sm text-danger hover:text-danger/80">Remove</button>
    </div>
</template>

<script>
function addLine() {
    const tpl = document.getElementById('line-template');
    document.getElementById('line-items').appendChild(tpl.content.cloneNode(true));
}
function removeLine(btn) {
    const items = document.querySelectorAll('.line-item');
    if (items.length > 1) btn.closest('.line-item').remove();
}
document.getElementById('line-items').addEventListener('change', function(e) {
    if (e.target.name === 'product_id') {
        const cost = e.target.selectedOptions[0].dataset.cost;
        const rateInput = e.target.closest('.line-item').querySelector('input[name="rate"]');
        if (cost && !rateInput.value) rateInput.value = cost;
    }
});
</script>

{% endblock %}
